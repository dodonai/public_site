name: Deploy prod to GCS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: 'Previous successful run ID to restore (blank builds current commit)'
        required: false
        type: string
concurrency:
  group: public-site-prod
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test launch behavior
        run: |
          npm run test:launch
      - name: Build release
        if: ${{ !inputs.rollback_run_id }}
        run: npm run build
        env:
          PUBLIC_NOINDEX: 'false'
          PUBLIC_SITE_URL: 'https://www.dodon.ai'
      - name: Restore previous release
        if: ${{ inputs.rollback_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: public-site-prod
          path: build
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
      - name: Exclude client deliverables
        run: rm -rf build/clients
      - name: Validate release
        run: node scripts/validate-build.js prod
      - name: Test deployment safeguards
        run: python3 scripts/test-deployment.py
      - name: Preserve rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-site-prod
          path: build/
          retention-days: 30
          if-no-files-found: error
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: 'access_token'
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload assets, then entry files
        run: python3 scripts/deploy-gcs.py --bucket dodonai-landing
      - name: Verify public delivery
        run: python3 scripts/verify-delivery.py https://www.dodon.ai
