<style>
:host { --brand:#3b5bdb; --bg:#fff; --muted:#6b7280; --in:#3b5bdb; --out:#eceef1; }  /* muted darkened for AA contrast */
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
:host { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f5f6f8; color:#1c1f23; }
  #launcher { position:fixed; z-index:300; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%;
    background:var(--brand); color:#fff; border:0; font-size:24px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.2); }
  #panel { position:fixed; z-index:301; right:20px; bottom:88px; width:340px; max-height:72vh; background:var(--bg);
    border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.18); display:none; flex-direction:column; overflow:hidden; }
  #panel.open { display:flex; }
  header { background:var(--brand); color:#fff; padding:12px 14px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header small { display:block; font-weight:400; opacity:.85; }
  #close { background:transparent; border:0; color:#fff; font-size:22px; line-height:1; cursor:pointer; padding:0 4px; border-radius:6px; opacity:.9; }
  #close:hover { opacity:1; background:rgba(255,255,255,.15); }
  #intro { padding:10px 12px; font-size:12.5px; color:#3a3f45; border-bottom:1px solid #eceef1; background:#fbfcfd; }
  .sys { align-self:center; font-size:11px; color:var(--muted); font-style:italic; text-align:center; margin:2px 8px; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:160px; }
  .msg { max-width:78%; padding:8px 10px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.in  { align-self:flex-end;   background:var(--in);  color:#fff; border-bottom-right-radius:3px; }
  .msg.out { align-self:flex-start; background:var(--out); color:#1c1f23; border-bottom-left-radius:3px; }
  .who { font-size:11px; color:var(--muted); margin:0 4px; align-self:flex-start; }
  .status { font-size:11px; opacity:.8; margin:0 4px; align-self:flex-end; }
  .status.failed { color:#e03131; cursor:pointer; }
  button.status { background:none; border:0; padding:0; font-family:inherit; font-size:11px; }  /* failed status is a real <button> (a11y) */
  /* lead strip — persistent until captured */
  #leadstrip { border-top:1px solid #eceef1; padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:#fbfcfd; }
  #leadstrip input[type=text], #leadstrip input#name, #leadstrip input#email { flex:1 1 40%; min-width:120px; font:inherit; padding:6px 8px; border:1px solid #d6d9de; border-radius:8px; }
  #optin { display:flex; gap:6px; align-items:flex-start; padding:0 10px 8px; font-size:12px; line-height:1.35; color:#3a3f45; cursor:pointer; background:#fbfcfd; }
  #optin input { flex:0 0 auto; margin:2px 0 0; }
  #leadchip { border-top:1px solid #eceef1; padding:6px 10px; font-size:12px; color:#2b8a3e; background:#f4fbf6; }
  #composer { border-top:1px solid #eceef1; padding:10px; display:flex; gap:6px; }
  #composer textarea { flex:1; font:inherit; padding:8px; border:1px solid #d6d9de; border-radius:8px; resize:none; }
  #composer button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:0 14px; cursor:pointer; font-weight:600; }
  #privacyline { padding:0 12px 10px; font-size:11px; color:var(--muted); text-align:center; }
  #privacyline a { color:var(--brand) !important; text-decoration:underline !important; }   /* keep it a link even if the host site resets <a> */
  .dbg { position:fixed; left:12px; bottom:12px; font-size:11px; color:var(--muted); background:#fff;
    border:1px solid #e6e8eb; border-radius:8px; padding:6px 8px; }
  /* FE-1: full-screen the panel on narrow phones (340px + margins would overflow) */
  @media (max-width:480px) {
    #panel { right:0; left:0; top:var(--chat-top, 0px); bottom:auto; width:auto; height:var(--chat-height, 100dvh); max-height:none; border-radius:0; }
    .dbg { display:none; }               /* debug readout clutters a phone screen */
  }
  :host { position: relative; z-index: 300; }  /* embed: top-level stacking context */
  .dbg { display:none !important; }   /* embed: hide the debug readout */
</style>
<button id="launcher" type="button" title="Chat" aria-label="Ask a question" aria-expanded="false">💬</button>

<div id="panel" role="dialog" aria-labelledby="cr-title">
  <header>
    <span id="cr-title">Chat with us</span>
    <button id="close" type="button" aria-label="Close chat">&times;</button>
  </header>
  <div id="intro">Questions about the App or custom AI services? Leave a message for the Dodonai team. Add your email if you’d like a reply.</div>
  <div id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Message history"></div>

  <!-- chat window = transcript (above) + input -->
  <form id="composer">
    <textarea id="msg" rows="1" placeholder="Type a message…" aria-label="Type your message" required></textarea>
    <button type="submit">Send</button>
  </form>

  <!-- lead capture, below the chat window: name/email, then the (non-US) opt-in, then the notice -->
  <div id="leadstrip">
    <input id="name"  placeholder="First name" aria-label="First name" autocomplete="given-name">
    <input id="email" type="email" placeholder="Email" aria-label="Email address" autocomplete="email">
  </div>
  <!-- express marketing consent (CASL) — non-US only; marketing-only label, distinct from the notice -->
  <label id="optin" hidden><input type="checkbox" id="optin-box"> Keep me posted with occasional Dodonai news and updates.</label>
  <div id="leadchip" hidden></div>
  <div id="privacyline">We'll use your email to reply and may send occasional updates — unsubscribe anytime. See our <a href="https://www.dodon.ai/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>.</div>
</div>

<div class="dbg" id="dbg">poll: idle</div>
