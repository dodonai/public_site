<!doctype html>
<html lang="en" data-theme="dodonai">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=chime-purple" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=chime-purple" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=chime-purple" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="dns-prefetch" href="https://www.googletagmanager.com" />

			rel="preload"
			href="/fonts/PlusJakartaDisplay-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
			fetchpriority="high"
		/>
		<link
			rel="preload"
			href="/fonts/PlusJakartaDisplay-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
			fetchpriority="high"
		/>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
		<!-- In-house website chat widget (replaces HubSpot chat) — self-contained, same-origin (/site-chat/* via the LB) -->
		<script src="%sveltekit.assets%/chat-widget.js?v=launch-20260915" defer></script>
	</body>
</html>
